<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block titulo %}{% endblock %} • CMS • Avila Ops</title>
<meta name="application-name" content="CMS">
<link rel="icon" type="image/svg+xml" href="/recursos/brand/favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="/recursos/brand/favicon-96x96.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/recursos/brand/apple-touch-icon.png">
<link rel="manifest" href="/recursos/brand/site.webmanifest">
<style>
@font-face{font-family:"Archivo";font-weight:100 900;font-display:swap;src:url(/recursos/fontes/archivo.woff2) format("woff2")}
:root{--papel:#f6f5f2;--superficie:#fff;--grafite:#1c1917;--suave:#57534e;--borda:#dedbd3;--borda-campo:#8c877d;--cota:#1a4fa0;--cota-forte:#143d7c;--sobre-cota:#fff;--terracota:#9a3412;--erro:#8a1c12;--erro-fundo:#fde8e6;--sucesso:#17502a;--sucesso-fundo:#e5f3e8;--atencao-fundo:#fff7e0;--afundada:#f5f5f4;--topo:3.5rem;--lateral:16rem;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--papel:#141210;--superficie:#24211e;--grafite:#f5f5f4;--suave:#a8a29e;--borda:#3a3632;--borda-campo:#857d76;--cota:#8fb4f0;--cota-forte:#b5cdf5;--sobre-cota:#0f1b2e;--terracota:#fb923c;--erro:#fca5a5;--erro-fundo:#3a1512;--sucesso:#86efac;--sucesso-fundo:#0f2a19;--atencao-fundo:#33280a;--afundada:#2a2622}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 "Archivo",system-ui,sans-serif;color:var(--grafite);background:var(--papel)}
[hidden]{display:none!important}
.barra{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:1rem;height:var(--topo);padding:0 1rem;background:var(--superficie);box-shadow:0 1px 0 var(--borda)}
a{color:var(--cota)}
.barra .marca-do-cms{display:flex;align-items:center;gap:.5rem;flex-shrink:0;color:var(--grafite);font-weight:700;text-decoration:none}
.assinatura{display:block;height:28px;width:auto}
.site-atual{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;color:var(--grafite);text-decoration:none;padding-left:1rem;border-left:1px solid var(--borda)}
.botao-menu{display:none}
.assinatura .m{fill:var(--terracota)}.assinatura .t{fill:var(--grafite)}.assinatura .a{fill:var(--suave)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--cota);outline-offset:2px}
main{max-width:32rem;margin:0 auto;padding:1rem}
h1{font-size:1.5rem;line-height:1.2;font-weight:800;letter-spacing:-.02em;margin:0}
h2{font-size:1.125rem;font-weight:700;margin:1.25rem 0 .5rem}
p{margin:.25rem 0}
.quem{color:var(--suave);font-size:.875rem}
.recado{padding:.6rem .75rem;border-radius:.5rem;margin:.75rem 0;font-size:.9375rem}
.erro{background:var(--erro-fundo);color:var(--erro)}
.aviso{background:var(--sucesso-fundo);color:var(--sucesso)}
ul{list-style:none;margin:0;padding:0}
li{background:var(--superficie);border:1px solid var(--borda);border-radius:.5rem;padding:.6rem .75rem;margin-bottom:.5rem}
li strong{display:block}
li a{color:var(--cota);overflow-wrap:anywhere}
.etiquetas{color:var(--suave);font-size:.8125rem}
form{background:var(--superficie);border:1px solid var(--borda);border-radius:.5rem;padding:.75rem}
label{display:block;font-size:.875rem;margin-top:.5rem}
label:first-child{margin-top:0}
input{width:100%;min-height:44px;font:inherit;color:inherit;background:var(--superficie);padding:.55rem .6rem;border:1px solid var(--borda-campo);border-radius:.4rem}
.dica{color:var(--suave);font-size:.8125rem}
select{width:100%;min-height:44px;font:inherit;color:inherit;padding:.55rem .6rem;border:1px solid var(--borda-campo);border-radius:.4rem;background:var(--superficie)}
.voltar{display:inline-block;margin-bottom:.5rem;color:var(--cota);font-size:.875rem}
.midia{display:flex;gap:.6rem;align-items:flex-start}
.midia code{display:block;word-break:break-all}
.ordem{display:flex;gap:.6rem;align-items:center;margin-top:.4rem}
.ordem input[type=number]{width:4.5rem;flex-shrink:0}
.busca div{display:flex;gap:.5rem}
.busca input{flex:1;min-width:0}
.busca button{width:auto;margin:0;white-space:nowrap}
.paginas{display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:1rem 0;font-size:.875rem;color:var(--suave)}
form.discreto{border:0;padding:0;background:none}
form.discreto button{width:auto;margin-top:.3rem;padding:.25rem .6rem;font-weight:400;font-size:.8125rem;background:var(--superficie);color:var(--erro);border:1px solid var(--erro)}
input[type=file]{padding:.4rem}
textarea{width:100%;font:inherit;color:inherit;background:var(--superficie);padding:.55rem .6rem;border:1px solid var(--borda-campo);border-radius:.4rem;min-height:6rem}
fieldset{border:1px solid var(--borda);border-radius:.5rem;margin:.75rem 0 0;padding:.6rem .75rem;min-width:0}
legend{font-size:.8125rem;color:var(--suave);padding:0 .3rem}
.mover{display:flex;gap:.4rem;margin-top:.5rem}
.mover button,.linha button{width:auto;margin:0;padding:.3rem .7rem;font-weight:400;font-size:.875rem;background:var(--superficie);color:var(--grafite);border:1px solid var(--borda-campo)}
.linha{display:flex;gap:.5rem;align-items:center;margin-top:.75rem}
.linha select{flex:1}
.problemas{background:var(--atencao-fundo);border-radius:.5rem;padding:.6rem .75rem .6rem 1.75rem;margin:.75rem 0;font-size:.9375rem;list-style:disc}
.problemas li{background:none;border:0;padding:0;margin:0 0 .25rem}
.bloqueia{color:var(--erro)}
.oculto{position:absolute;left:-200vw}
.secundario{background:var(--superficie);color:var(--cota);border:1px solid var(--cota)}
.marcar{display:flex;gap:.5rem;align-items:center}
.marcar input{width:auto}
.atalhos{display:flex;flex-wrap:wrap;gap:.75rem;margin:.5rem 0;font-size:.9375rem}
.atalhos a{color:var(--cota)}
button{width:100%;min-height:44px;margin-top:.75rem;font:inherit;font-weight:600;padding:.7rem;cursor:pointer;border:0;border-radius:.4rem;background:var(--cota);color:var(--sobre-cota)}
button:hover{background:var(--cota-forte)}
.secundario:hover,form.discreto button:hover,.mover button:hover,.linha button:hover{background:var(--papel)}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
.botao{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:44px;padding:.55rem 1rem;border:1px solid var(--cota);border-radius:.4rem;font-weight:600;text-decoration:none;text-align:center;background:var(--cota);color:var(--sobre-cota)}
.botao:hover{background:var(--cota-forte);border-color:var(--cota-forte)}
.botao.secundario{background:transparent;color:var(--cota);border-color:var(--borda-campo)}
.botao.secundario:hover{background:var(--afundada);border-color:var(--cota)}
button.perigo,.perigo{background:transparent;color:var(--erro);border:1px solid var(--erro)}
button.perigo:hover{background:var(--erro-fundo)}
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.15rem .6rem;border-radius:999px;font-size:.75rem;font-weight:600;line-height:1.5;white-space:nowrap;background:var(--afundada);color:var(--suave)}
.chip.ok{background:var(--sucesso-fundo);color:var(--sucesso)}
.chip.falta{background:var(--atencao-fundo);color:var(--terracota)}
.cartao{background:var(--superficie);border:1px solid var(--borda);border-radius:.75rem;padding:1rem}
.cartao>h2:first-child,.cartao>summary h2{margin-top:0}
.cabecalho-da-pagina{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:.75rem 1rem;margin-bottom:1rem}
.cabecalho-da-pagina .acoes{display:flex;flex-wrap:wrap;gap:.5rem}
/* O menu do site: barra lateral fixa no computador, gaveta no celular. */
.alternar{position:absolute;width:1px;height:1px;opacity:0;margin:0;min-height:0;pointer-events:none}
.lateral{display:flex;flex-direction:column;gap:.15rem;padding:1rem .75rem;background:var(--superficie);overflow-y:auto;overscroll-behavior:contain}
.lateral li{background:none;border:0;padding:0;margin:0}
.lateral .aos-sites{display:flex;align-items:center;min-height:44px;padding:0 .75rem;color:var(--suave);text-decoration:none;font-size:.875rem}
.lateral .aos-sites:hover{color:var(--grafite)}
.lateral .nome-do-site{margin:0 0 .5rem;padding:.25rem .75rem .75rem;border-bottom:1px solid var(--borda);font-size:1.0625rem;font-weight:800;overflow-wrap:anywhere}
.lateral .grupo{margin:.9rem .75rem .3rem;font-size:.6875rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--suave)}
.lateral nav a,.lateral .fim a{display:flex;align-items:center;min-height:44px;padding:0 .75rem;border-radius:.4rem;color:var(--grafite);text-decoration:none}
.lateral nav a:hover,.lateral .fim a:hover{background:var(--afundada)}
.lateral nav a[aria-current]{background:color-mix(in srgb,var(--cota) 18%,transparent);color:var(--cota-forte);font-weight:700;box-shadow:inset 3px 0 0 var(--cota)}
.lateral .fim{margin-top:auto;padding-top:.75rem;border-top:1px solid var(--borda)}
.fechar-menu{display:none}
.fundo-do-menu{display:none}
@media (max-width:55.99rem){
.assinatura{height:24px;width:auto}
.botao-menu{display:inline-flex;align-items:center;gap:.5rem;min-height:44px;margin:0;padding:0 .9rem;border:1px solid var(--borda-campo);border-radius:.4rem;font-size:.9375rem;font-weight:600;cursor:pointer;user-select:none;color:var(--grafite)}
.botao-menu::before{content:"";width:1.1em;height:.75em;border-block:2px solid currentColor;background:linear-gradient(currentColor,currentColor) center/100% 2px no-repeat}
body:has(.alternar:focus-visible) .botao-menu{outline:3px solid var(--cota);outline-offset:2px}
.lateral{position:fixed;inset:0 auto 0 0;z-index:50;width:min(19rem,86vw);visibility:hidden;transform:translateX(-105%);transition:transform .2s ease,visibility .2s;box-shadow:0 0 2rem rgb(0 0 0/.4)}
.alternar:checked~.lateral{visibility:visible;transform:none}
.alternar:checked~.fundo-do-menu{display:block;position:fixed;inset:0;z-index:45;background:rgb(0 0 0/.55);cursor:pointer}
.fechar-menu{display:flex;align-items:center;justify-content:center;align-self:flex-end;min-height:44px;margin:0;padding:0 .9rem;border:1px solid var(--borda-campo);border-radius:.4rem;font-weight:600;cursor:pointer}
.barra-de-salvar{position:sticky;bottom:0;z-index:5}
}
@media (prefers-reduced-motion:reduce){.lateral{transition:none}}
@media (min-width:56rem){
.alternar{display:none}
.lateral{position:fixed;top:var(--topo);bottom:0;left:0;width:var(--lateral);border-right:1px solid var(--borda)}
.lateral~main{max-width:none;margin:0 0 0 var(--lateral);padding:1.5rem clamp(1rem,3vw,2.5rem) 4rem}
.lateral~main>*{max-width:56rem}
.lateral~main>.largo{max-width:76rem}
}
main.largo{max-width:66rem}
/* Meus sites */
.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:1rem;margin:1rem 0 2rem}
.sites>li{display:flex;flex-direction:column;margin:0;padding:0;overflow:hidden;border-radius:.75rem}
.sites .capa{display:block;aspect-ratio:16/9;background:var(--afundada);line-height:0}
.sites .capa img{width:100%;height:100%;object-fit:cover}
.sites .inicial{display:flex;align-items:center;justify-content:center;height:100%;font-size:2.5rem;font-weight:800;line-height:1;color:var(--suave)}
.sites .corpo{flex:1;display:flex;flex-direction:column;gap:.2rem;padding:.9rem 1rem .25rem}
.sites h2{margin:0;font-size:1.125rem}
.sites h2 a{color:var(--grafite);text-decoration:none}
.sites h2 a:hover{color:var(--cota)}
.sites .endereco{font-size:.875rem;color:var(--suave);overflow-wrap:anywhere}
.sites .acoes{display:flex;flex-wrap:wrap;gap:.5rem;padding:.75rem 1rem 1rem}
.sites .acoes .botao{flex:1 1 auto;padding:.5rem .75rem;font-size:.9375rem}
.novo-site{max-width:32rem}
/* Conteúdo do site */
.novos{display:flex;flex-wrap:wrap;gap:.5rem;margin:.75rem 0 1rem}
.novos .botao{flex:1 1 9rem}
.documentos li{display:flex;flex-direction:column;gap:.15rem;padding:.75rem .9rem}
.documentos li>a{text-decoration:none}
/* Imagens */
.grade-de-imagens{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem;margin:.75rem 0}
@media (min-width:40rem){.grade-de-imagens{grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr))}}
.grade-de-imagens>li{display:flex;flex-direction:column;margin:0;padding:0;overflow:hidden;border-radius:.6rem}
.abrir-imagem{display:flex;flex:1;flex-direction:column;color:inherit;text-decoration:none}
.abrir-imagem img,.abrir-imagem .sem-miniatura{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:var(--afundada)}
.abrir-imagem .sem-miniatura{display:flex;align-items:center;justify-content:center;padding:.5rem;text-align:center;font-size:.8125rem;color:var(--suave)}
.abrir-imagem:hover img{opacity:.88}
.abrir-imagem:focus-visible{outline-offset:-3px}
.abrir-imagem .texto{display:flex;flex-direction:column;gap:.2rem;padding:.5rem .6rem .6rem;font-size:.8125rem}
.abrir-imagem strong{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600;overflow-wrap:anywhere}
.papeis{display:flex;flex-wrap:wrap;gap:.25rem}
.envio{max-width:40rem}
dialog.janela{width:min(62rem,calc(100vw - 2rem));max-height:calc(100dvh - 2rem);padding:0;overflow:auto;border:1px solid var(--borda);border-radius:.9rem;background:var(--superficie);color:var(--grafite)}
dialog.janela::backdrop{background:rgb(0 0 0/.6)}
html:not(.com-script) dialog.janela:target{display:block;position:fixed;inset:0;z-index:60;margin:auto;box-shadow:0 0 0 100vmax rgb(0 0 0/.6)}
.janela-topo{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.6rem 1rem;background:var(--superficie);border-bottom:1px solid var(--borda)}
.janela-topo h2{margin:0;font-size:1.0625rem}
.fechar{display:inline-flex;align-items:center;min-height:44px;padding:0 1rem;border:1px solid var(--borda-campo);border-radius:.4rem;color:var(--grafite);text-decoration:none;font-weight:600}
.janela-corpo{display:grid;gap:1rem;padding:1rem}
.janela-imagem{margin:0}
.janela-imagem img{display:block;width:100%;max-height:62vh;object-fit:contain;border-radius:.5rem;background:var(--afundada)}
.janela-imagem figcaption{margin-top:.5rem;font-size:.8125rem;color:var(--suave)}
.janela form{border:0;padding:0;background:none}
.acoes-da-janela{position:sticky;bottom:0;z-index:1;margin-top:.75rem;padding:.25rem 0 .75rem;background:var(--superficie)}
.acoes-da-janela button{margin-top:.5rem}
@media (min-width:48rem){.janela-corpo{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}.janela-imagem{position:sticky;top:4.5rem}}
@media (max-width:47.99rem){dialog.janela{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;border:0;border-radius:0}}
/* Identidade */
@font-face{font-family:"Oswald";font-weight:200 700;font-display:swap;src:url(/recursos/fontes/oswald.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Serif";font-weight:700;font-display:swap;src:url(/recursos/fontes/plex-serif-700.woff2) format("woff2")}
.identidade{display:grid;gap:1rem}
form.identidade-campos{display:grid;gap:1rem;border:0;padding:0;background:none}
.identidade-campos details.cartao>summary{margin:-.25rem 0}
.identidade-campos details.cartao>summary h2{margin:0}
.identidade-campos details[open].cartao>summary{margin-bottom:.5rem}
.grade-de-icones{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr))}
.icone{display:flex;flex-direction:column;gap:.5rem;min-width:0;padding:.9rem;border:1px solid var(--borda);border-radius:.6rem;background:var(--papel)}
.icone-topo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem}
.icone h3{margin:0;font-size:1rem}
.quadro{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:1rem;min-height:7.5rem;padding:.9rem;border-radius:.5rem;background:repeating-conic-gradient(var(--afundada) 0 25%,transparent 0 50%) 0 0/16px 16px}
.quadro img{object-fit:contain}
.quadro .vazio{display:none;align-self:center;color:var(--suave);font-size:.875rem}
.quadro img[hidden]+.vazio,.quadro:not(:has(img:not([hidden])))>.vazio{display:block}
.tamanho:has(img[hidden]){display:none}
.logo-grande{width:auto;height:auto;max-width:100%;max-height:5.5rem}
.tamanho{display:flex;flex-direction:column;align-items:center;gap:.3rem;margin:0;font-size:.6875rem;color:var(--suave)}
.t16{width:16px;height:16px}.t32{width:32px;height:32px}.t48{width:48px;height:48px}
.t180{width:180px;height:180px;max-width:100%;border-radius:22%;background:#fff}
.icone details{border-top:1px solid var(--borda);padding-top:.25rem}
.grade-de-temas{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr))}
label.cartao-de-tema{position:relative;display:flex;flex-direction:column;gap:.3rem;margin:0;padding:.6rem;border:2px solid var(--borda);border-radius:.6rem;background:var(--superficie);cursor:pointer}
.cartao-de-tema input{position:absolute;width:1px;height:1px;min-height:0;opacity:0;pointer-events:none}
.cartao-de-tema:has(input:checked){border-color:var(--cota)}
.cartao-de-tema:has(input:focus-visible){outline:3px solid var(--cota);outline-offset:2px}
.cartao-de-tema:has(input:checked) .nome-do-tema::after{content:" ✓";color:var(--cota)}
.nome-do-tema{font-weight:700;font-size:.9375rem}
.miniatura-do-tema{display:flex;flex-direction:column;gap:.3rem;height:5.5rem;padding:.6rem;border:1px solid rgb(0 0 0/.08);border-radius:.4rem;background:var(--fundo);color:var(--texto);font-family:var(--fonte)}
.mt-titulo{font-size:1.25rem;font-weight:700;line-height:1}
.mt-linha{height:.35rem;border-radius:1px;background:currentColor;opacity:.25}
.mt-linha.curta{width:60%}
.mt-botao{width:3.25rem;height:.9rem;margin-top:auto;border-radius:var(--cantos);background:var(--destaque)}
.cor{display:flex;gap:.5rem;align-items:center}
.cor input[type=color]{width:3.25rem;flex-shrink:0;padding:.2rem}
.amostra-da-cor{width:44px;height:44px;flex-shrink:0;border-radius:.4rem;border:1px solid var(--borda-campo);background:var(--destaque)}
.barra-de-salvar{padding:.75rem 0 .5rem;background:linear-gradient(transparent,var(--papel) 35%)}
.barra-de-salvar button{margin:0}
.previa{display:flex;flex-direction:column;gap:.75rem;min-width:0}
.previa .rotulo{margin:0;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--suave)}
.aba{display:flex;align-items:center;gap:.5rem;max-width:15rem;padding:.45rem .7rem;border-radius:.5rem .5rem 0 0;background:#e8eaed;color:#202124;font:13px/1.2 system-ui,sans-serif}
.aba img{width:16px;height:16px;flex-shrink:0;object-fit:contain}
.aba span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-site{overflow:hidden;border:1px solid var(--borda);border-radius:0 .5rem .5rem .5rem;background:var(--fundo);color:var(--texto);font:14px/1.4 system-ui,sans-serif}
.pv-topo{display:flex;align-items:center;gap:.5rem;padding:.6rem .75rem;border-bottom:1px solid rgb(0 0 0/.1)}
.pv-topo img{width:auto;height:1.75rem;max-width:6rem;object-fit:contain}
.pv-marca,.pv-titulo{font-family:var(--fonte);font-weight:700;overflow-wrap:anywhere}
.pv-menu{display:flex;gap:.75rem;padding:.4rem .75rem;font-size:12px;color:var(--destaque)}
.pv-corpo{display:flex;flex-direction:column;gap:.4rem;padding:.75rem}
.pv-titulo{font-size:1.125rem;line-height:1.2}
.pv-linha{height:.4rem;border-radius:1px;background:currentColor;opacity:.18}
.pv-botao{align-self:flex-start;margin-top:.25rem;padding:.3rem .75rem;border-radius:var(--cantos);background:var(--destaque);color:#fff;font-size:12px;font-weight:600}
.pv-rodape{padding:.5rem .75rem;border-top:1px solid rgb(0 0 0/.1);font-size:11px;opacity:.75}
.pv-iphone{display:flex;flex-direction:column;align-items:center;gap:.35rem;width:7.5rem;padding:1rem .75rem;border-radius:1rem;background:linear-gradient(160deg,#334155,#0f172a);color:#fff;font:11px/1.2 system-ui,sans-serif;text-align:center}
.pv-iphone img{width:60px;height:60px;border-radius:14px;background:#fff;object-fit:contain}
.pv-iphone .vazio{display:flex;align-items:center;justify-content:center;width:60px;height:60px;border-radius:14px;background:rgb(255 255 255/.15)}
.pv-iphone img:not([hidden])+.vazio{display:none}
.pv-iphone span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (min-width:72rem){.identidade{grid-template-columns:minmax(0,1fr) 18rem;align-items:start}.previa{grid-column:2;grid-row:1;position:sticky;top:calc(var(--topo) + 1.5rem)}}
@media (max-width:71.99rem){.previa{flex-direction:row;flex-wrap:wrap;align-items:flex-start}.previa .rotulo{flex-basis:100%}.previa .pv-navegador{flex:1 1 15rem}}
</style>
</head>
<body>
<header class="barra"><a class="marca-do-cms" href="/painel" aria-label="CMS • Avila Ops"><img class="assinatura" src="/recursos/brand/favicon.svg" width="28" height="28" alt=""><span>CMS</span></a>{% block barra %}{% endblock %}</header>
{% block lateral %}{% endblock %}
<main class="{% block largura %}{% endblock %}">
{% block conteudo %}{% endblock %}
</main>
{% block script %}{% endblock %}
</body>
</html>
